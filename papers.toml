[duongIncorporatingSocialDeterminants2024]
abstract = "During COVID-19 in the US, social determinants of health (SDH) have driven health disparities. However, the use of SDH in COVID-19 vaccine modeling is unclear. This review aimed to summarize the current landscape of incorporating SDH into COVID-19 vaccine transmission modeling in the US. Medline and Embase were searched up to October 2022. We included studies that used transmission modeling to assess the effects of COVID-19 vaccine strategies in the US. Studies' characteristics, factors incorporated into models, and approaches to incorporate these factors were extracted. Ninety-two studies were included. Of these, 11 studies incorporated SDH factors (alone or combined with demographic factors). Various sets of SDH factors were integrated, with occupation being the most common (8 studies), followed by geographical location (5 studies). The results show that few studies incorporate SDHs into their models, highlighting the need for research on SDH impact and approaches to incorporating SDH into modeling. Funding: This research was funded by the Centers for Disease Control and Prevention (CDC)."
