[tanakaImaginaryNetworkMotifs2024]
entrytype = 'article'
title = 'Imaginary Network Motifs: Structural Patterns of False Positives and Negatives in Social Networks'
shorttitle = 'Imaginary Network Motifs'
author = ['Tanaka, Kyosuke', 'Vega Yon, George G.']
year = '2024'
month = 'jul'
journal = 'Social Networks'
volume = '78'
pages = '65–80'
issn = '0378-8733'
doi = '10.1016/j.socnet.2023.11.005'
url = 'https://doi.org/10.1016/j.socnet.2023.11.005'
abstract = 'We examine the structural patterns in the cognitive representation of social networks by systematically classifying false positives and negatives. Although existing literature on Cognitive Social Structures (CSS) has begun exploring false positives and negatives by comparing actual and perceived networks, it has not differentiated simultaneous occurrences of true and false positives and negatives on network motifs, such as reciprocity and triadic closure. Here, we propose a theoretical framework to categorize three classes of errors we call imaginary network motifs as combinations of accurately and erroneously perceived ties: (a) partially false, (b) completely false, and (c) mixed false. Using four published CSS data sets, we empirically test which imaginary network motifs are significantly more or less present in different types of perceived networks than the corresponding actual networks. Our results confirm that people not only fill in the blanks as suggested in the prior research but also conceive other imaginary structures. The findings advance our understanding of perception gaps between actual and perceived networks and have implications for designing more accurate network modeling and sampling.'
keywords = ['published', 'Cognitive errors', 'Cognitive Social Structures', 'Network motifs', 'Network perceptions', 'Social networks']
software = ['imaginarycss']

[ouellet2022]
entrytype = 'article'
title = 'Officer Networks and Firearm Behaviors: Assessing the Social Transmission of Weapon-Use'
author = ['Marie Ouellet', 'Sadaf Hashimi', 'Vega Yon, George G.']
year = '2022'
month = '6'
doi = '10.1007/s10940-022-09546-9'
issn = '0748-4518'
journal = 'Journal of Quantitative Criminology'
url = 'https://doi.org/10.1007/s10940-022-09546-9'
volume = '39'
number = '3'
pages = '679–703'
abstract = "Objectives: We reconstruct the networks of officers co-involved in force incidents to test whether interactions with weapon-prone peers impact firearm use. Methods: We draw from a statewide dataset of force incidents across law enforcement agencies in New Jersey, and employ conditional likelihood models to estimate whether exposure to peers with histories of firearm use is associated with an officer's own likelihood of firearm use net of other contextual confounders. Results: We find preliminary evidence that officer firearm behaviors, including drawing, pointing, and discharging a firearm, is influenced by an officer's peers. Greater exposure to colleagues with histories of firearm use is associated with a lower risk of using a firearm. We also find that officer features, including experience and race/ethnicity, are associated with the risk of firearm use. Conclusions: Our study suggests officers' peers structure the risk of firearm use. Our data allow us to look at time order and rule out situational confounders pertaining to firearm use; however, do not allow us to infer causality. We discuss the study's implications for understanding firearm behaviors and the role of network science in moving policing research forward."
keywords = ['published']

