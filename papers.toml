abstract = 'Markov Chain Monte Carlo (MCMC) is used in a variety of statistical and computational venues such as: statistical inference, Markov quadrature (also known as Monte Carlo integration), stochastic optimization, among others. The fmcmc R package provides a flexible framework for implementing MCMC methods that use the Metropolis-Hastings algorithm. fmcmc provides the following out-of-the-box features that can be valuable for both practitioners of MCMC and educators: seamless efficient multiple-chain sampling using parallel computing, user-defined transition kernels, and automatic stop using convergence monitoring.'
