[VegaYon2019b]
entrytype = 'article'
title = 'slurmR: A lightweight wrapper for HPC with Slurm'
author = ['Vega Yon, George G.', 'Marjoram, Paul']
year = '2019'
month = '7'
doi = '10.21105/joss.01493'
issn = '2475-9066'
journal = 'Journal of Open Source Software'
number = '42'
pages = '1493'
url = 'https://joss.theoj.org/papers/10.21105/joss.01493'
volume = '4'
abstract = 'Nowadays, high-performance-computing (HPC) clusters are commonly available tools for either in or out of cloud settings. The Slurm Workload Manager is a program written in C that is used to efficiently manage resources in HPC clusters. While the R programming language has not been developed for HPC settings, there are currently several ways in which R can be enhanced by means of HPC. The slurmR R package is one of those ways: it provides tools for using R in HPC settings that work with Slurm, offering wrappers and auxiliary functions that allow the user to seamlessly integrate their analysis pipeline with HPC, putting emphasis on providing the user with a family of functions similar to those that the parallel R package provides. In summary, slurmR provides a dependency-free and purpose-built alternative for R users working in a HPC environment with Slurm.'
keywords = ['published']
software = ['slurmR']

[Valente2020]
entrytype = 'article'
title = 'Diffusion/Contagion Processes on Social Networks'
author = ['Valente, Thomas W.', 'Vega Yon, George G.']
year = '2020'
doi = '10.1177/1090198120901497'
issn = '1090–1981'
journal = 'Health Education & Behavior'
volume = '47'
number = '2'
pages = '235–248'
url = 'http://journals.sagepub.com/doi/10.1177/1090198120901497'
abstract = 'This study models how new ideas, practices, or diseases spread within and between communities, the diffusion of innovations or contagion. Several factors affect diffusion such as the characteristics of the initial adopters, the seeds; the structure of the network over which diffusion occurs; and the shape of the threshold distribution, which is the proportion of prior adopting peers needed for the focal individual to adopt. In this study, seven seeding conditions are modeled: (1) three opinion leadership indicators, (2) two bridging measures, (3) marginally positioned seeds, and (4) randomly selected seeds for comparison. Three network structures are modeled: (1) random, (2) small-world, and (3) scale-free. Four threshold distributions are modeled: (1) normal; (2) uniform; (3) beta 7,14; and (4) beta 1,2; all of which have a mean threshold of 33%, with different variances. The results show that seeding with nodes high on in-degree centrality and/or inverse constraint has faster and more widespread diffusion. Random networks had faster and higher prevalence of diffusion than scale-free ones, but not different from small-world ones. Compared with the normal threshold distribution, the uniform one had faster diffusion and the beta 7,14 distribution had slower diffusion. Most significantly, the threshold distribution standard deviation was associated with rate and prevalence such that higher threshold standard deviations accelerated diffusion and increased prevalence. These results underscore factors that health educators and public health advocates should consider when developing interventions or trying to understand the potential for behavior change.'
keywords = ['published']

[VegaYon2021rgexf]
entrytype = 'article'
title = 'Building, Importing, and Exporting GEXF Graph Files with rgexf'
author = ['George G. Vega Yon']
year = '2021'
month = '6'
journal = 'Journal of Open Source Software'
volume = '6'
doi = '10.21105/joss.03456'
url = 'https://doi.org/10.21105/joss.03456'
pages = '3456'
number = '64'
abstract = 'First introduced in 2012, the rgexf package for the R programming language was the first effort to make the Graph Exchange XML Format (GEXF) specification available to the R world. With more than 500,000 downloads, it is one of the most popular ways to incorporate GEXF files into the R programming language environment. Beyond reading and writing GEXF files from within R, the rgexf R package has various other features that can help to create beautiful network visualizations: users can create GEXF objects from scratch, adding and removing nodes and edges as needed; users of the igraph package can directly convert objects between gexf and igraph classes; and, thanks to the gexf-js javascript library, users can immediately visualize their network objects in the web browser.'
keywords = ['published']
software = ['rgexf']

[Hancean2022]
entrytype = 'article'
title = 'The formation of political discussion networks'
author = ['Hâncean, Marian-Gabriel', 'Perc, Matjaž', 'Vega Yon, George G.', 'Gheorghiță, Adrian', 'Mihăilă, Bianca-Elena']
year = '2022'
month = '1'
journal = 'Royal Society Open Science'
volume = '9'
number = '1'
pages = '211609'
doi = '10.1098/rsos.211609'
url = 'https://royalsocietypublishing.org/doi/abs/10.1098/rsos.211609'
abstract = 'Dialogues among politicians provide a window into political landscapes and relations among parties and nations. Existing research has focused on the outcomes of such dialogues and on the structure of social networks on which they take place. Little is known, however, about how political discussion networks form and which are the main driving forces behind their formation. We study a collection of ego-networks from 30 randomly sampled Romanian politicians to reveal fundamental processes behind the formation of political discussion networks. We show that ties in such networks tend to be strong and balanced, and that their organization is not affected by sex, age or education homophily. We use the exponential family of random graph models for small networks to assess likely closure mechanisms and possible homophily effects, but we note that further research and additional data are needed to fully understand the impact of context and political affiliations on the generalization of our findings.'
keywords = ['published']

[panahiVeteranPerspectivesEpilepsy2023]
entrytype = 'article'
title = 'Veteran Perspectives of Epilepsy Care: Impact of Veteran Satisfaction, Knowledge, and Proactivity'
shorttitle = 'Veteran Perspectives of Epilepsy Care'
author = ['Panahi, Samin', 'Kennedy, Eamonn', 'Roghani, Ali', 'Vega Yon, George G.', 'VanCott, Anne', 'Gugger, James J.', 'Raquel Lopez, Maria', 'Jo Pugh, Mary']
year = '2023'
month = '7'
journal = 'Epilepsy & Behavior'
volume = '144'
pages = '109218'
issn = '15255050'
doi = '10.1016/j.yebeh.2023.109218'
langid = 'english'
url = 'https://doi.org/10.1016/j.yebeh.2023.109218'
abstract = "Objective: Veterans are at elevated risk of epilepsy due to higher rates of traumatic brain injury (TBI). However, little work has examined the extent to which quality of care is associated with key outcomes for Veterans with epilepsy (VWE). This study aimed to examine the impact of quality of care on three outcomes: patients' knowledge of epilepsy self-care, proactive epilepsy self-management, and satisfaction with care. Method: We conducted a cross-sectional study of Post-9/11 Veterans with validated active epilepsy who received VA care (n = 441). Veterans were surveyed on care processes using American Academy of Neurology epilepsy quality measures, and a patient-generated measure related to the use of emergency care. Outcome measures included epilepsy self-care knowledge, proactive epilepsy self-management, and satisfaction with epilepsy care. Covariates included sociodemographic and health status variables and a measure of patient-provider communication. An ordinary least-squares (OLS) regression model was used to determine if the quality of care was associated with the outcomes adjusting for multiple comparisons. Results: Self-reported measures of quality of care were broadly associated with satisfaction with care and epilepsy knowledge. OLS modeling indicated that healthcare provider guidance on when to seek emergency care was significantly associated with higher Veteran satisfaction with care (p $<$ 0.01). Veterans who were asked about seizure frequency at every visit by their provider also reported higher satisfaction with care (p $<$ 0.01) and increased epilepsy knowledge (p $<$ 0.01). Veteran-provider communication was positively associated with epilepsy knowledge and proactive epilepsy self-management. Veterans with epilepsy with drug resistance epilepsy were significantly less satisfied with their care and reported lower proactivity compared to epilepsy controlled with medications. Further analysis indicated Black VWEs reported lower scores on epilepsy self-care knowledge compared to Whites (p $<$ 0.001). Conclusions: This study found that quality measures were associated with satisfaction and epilepsy knowledge but not associated with proactive self-management in multivariable models. The finding that better communication between providers and Veterans suggests that in addition to technical quality, interpersonal quality is important for patient outcomes. The secondary analysis identified racial disparities in epilepsy knowledge. This work offers opportunities to improve the quality of epilepsy care through the practice of patient-centered care models that reflect Veteran priorities and perceptions."
keywords = ['published']

[loveCharacterizingSpatiotemporalVariation2023]
entrytype = 'techreport'
title = 'Characterizing Spatiotemporal Variation in Transmission Heterogeneity during the 2022 Mpox Outbreak in the USA'
author = ['Love, Jay', 'LaPrete, Cormac R.', 'Sheets, Theresa R.', 'Vega Yon, George G.', 'Thomas, Alun', 'Samore, Matthew H.', 'Keegan, Lindsay T.', 'Adler, Frederick R.', 'Slayton, Rachel B.', 'Spicknall, Ian H.', 'Toth, Damon J.A.']
year = '2023'
month = '5'
type = 'Preprint'
institution = 'Epidemiology'
doi = '10.1101/2023.05.10.23289580'
langid = 'english'
abstract = 'Understanding how transmission heterogeneity varies over the course of an enduring infectious disease outbreak improves understanding of observed disease dynamics and informs public health strategy. We quantified the spatiotemporal variation in transmission heterogeneity for the 2022 mpox outbreak in the US using the dispersion parameter of the offspring distribution, k . Our methods fit negative binomial distributions to transmission chain offspring distributions informed by a large mpox contact tracing dataset. We found that estimates of transmission heterogeneity varied across the outbreak, but overall estimated transmission heterogeneity was low. When testing our methods on simulated data, estimate accuracy depended on contact tracing data accuracy and completeness. Because the actual contact tracing data had high incompleteness, the values of k estimated from the empirical data may therefore be artificially high. Through simulation, we explore a method to correct estimated k for data incompleteness and, further, explore baseline expectations for temporal dynamics of k .'
keywords = ['wip']

[vegayonDiscreteExponentialFamilyModels2022]
entrytype = 'misc'
title = 'Discrete Exponential-Family Models for Multivariate Binary Outcomes'
author = ['Vega Yon, George G.', 'Pugh, Mary Jo', 'Valente, Thomas W.']
year = '2022'
month = '11'
number = 'arXiv:2211.00627'
eprint = '2211.00627'
primaryclass = 'cs, stat'
publisher = 'arXiv'
archiveprefix = 'arxiv'
doi = '10.48550/arXiv.2211.00627'
url = 'https://arxiv.org/abs/2211.00627'
abstract = 'Studies that collect multi-outcome data such as tobacco and alcohol use are becoming increasingly common. In principle, multi-outcomes studies investigate the correlations between outcomes, including, causal links and/or joint distributions. Although there are many methods for studying multivariate outcomes, significant limitations regarding scale and interpretation persist. Here we introduce a model based on the exponential-family for discrete binary outcomes that provides a flexible framework for hypothesis testing of multiple binary outcomes in a computationally efficient fashion.'
keywords = ['wip']
software = ['defm']

[vegayonPowerMulticollinearitySmall2023a]
entrytype = 'article'
title = 'Power and Multicollinearity in Small Networks: A Discussion of “Tale of Two Datasets: Representativeness and Generalisability of Inference for Samples of Networks” by Krivitsky, Coletti, and Hens'
shorttitle = 'Power and Multicollinearity in Small Networks'
author = ['Vega Yon, George G.']
year = '2023'
month = '10'
journal = 'Journal of the American Statistical Association'
volume = '118'
number = '544'
pages = '2228–2231'
issn = '0162-1459, 1537-274X'
doi = '10.1080/01621459.2023.2252041'
langid = 'english'
url = 'https://doi.org/10.1080/01621459.2023.2252041'
abstract = 'The recent work by Krivitsky, Coletti & Hens [KCH] provides an important new contribution to the Exponential-Family Random Graph Models [ERGMs], a start-to-finish approach to dealing with multi-network ERGMs. Although multi-network ERGMs have been around for a while (mostly in the form of block-diagonal models and multi-level ERGMs, see Duxbury and Wertsching (2023), Wang et al. (2013), Slaughter and Koehly (2016)), not much care has been given to the estimation and post-estimation steps. In their paper, Krivitsky, Coletti & Hens give a detailed layout of how to build, estimate, and analyze multi-ERGMs with heterogeneous data sources. In this comment, I will focus on two issues the authors did not discuss, namely, sample size requirements and multicollinearity.'
keywords = ['published']

[meyerEpiworldRFastAgentBased2023]
entrytype = 'article'
title = 'epiworldR: Fast Agent-Based Epi Models'
shorttitle = 'epiworldR'
author = ['Meyer, Derek', 'Vega Yon, George G']
year = '2023'
month = 'oct'
journal = 'Journal of Open Source Software'
volume = '8'
number = '90'
pages = '5781'
issn = '2475-9066'
doi = '10.21105/joss.05781'
url = 'https://doi.org/10.21105/joss.05781'
abstract = "Agent-based modeling (ABM) has emerged as a powerful computational approach to studying complex systems across various fields, including social sciences and epidemiology. By simulating the interactions and behaviors of individual entities, known as agents, ABM provides a unique lens through which researchers can analyze and understand the emergent properties and dynamics of these systems. The epiworldR package provides a flexible framework for ABM implementation and methods for prototyping disease outbreaks and transmission models using a C++ backend. It supports multiple epidemiological models, including the Susceptible-Infected-Susceptible (SIS), Susceptible-Infected-Removed (SIR), Susceptible-Exposed-Infected-Removed (SEIR), and others, involving arbitrary mitigation policies and multiple-disease models. Users can specify transmission/susceptibility rates as a function of agents' features, providing great complexity for the model dynamics."
keywords = ['published']
software = ['epiworldR']

[sargentAssessingDynamicsPrEP2024]
entrytype = 'article'
title = 'Assessing the Dynamics of PrEP Adoption in a National-Scale Physician Network'
author = ['Sargent, Matthew', 'Matthews, Luke J.', 'Vega Yon, George G.', 'Storholm, Erik D.', 'Ober, Allison J.', 'Green, Harold D.']
year = '2024'
month = 'jul'
journal = 'Social Networks'
volume = '78'
pages = '226–237'
issn = '03788733'
doi = '10.1016/j.socnet.2024.02.001'
urldate = '2024-04-13'
langid = 'english'
abstract = 'This study examines the adoption of a new preventive treatment for HIV called preexposure prophylaxis (PrEP) in a nation-wide network of US physicians. We compare the structure of these networks across nine multi-state census regions, and assess geographic variations in network structure. Within these networks, we measured the adoption threshold associated with physician adoption of PrEP. The low threshold values that we observe are consistent with the hypothesis that slow PrEP adoption is the result of a lack of knowledge and exposure among physicians. Regression results demonstrate the mix of market, epidemiological, and socio/cultural factors that shape adoption thresholds.'
keywords = ['published']

[piombo2025]
entrytype = 'article'
title = 'The impact of social norms on diffusion dynamics: A simulation of e-cigarette use behavior'
author = ['Sarah Piombo', 'George G. Vega Yon', 'Thomas W. Valente']
year = '2025'
month = '3'
journal = 'Health Education & Behavior'
volume = '52'
number = '4'
pages = '428–438'
doi = '10.1177/10901981251327189'
url = 'https://doi.org/10.1177/10901981251327189'
abstract = 'Diffusion of innovations theory can be used to understand how to prevent or slow the spread of harmful behaviors, such as e-cigarette use in adolescent social networks. This study explores how different network intervention strategies could impact diffusion dynamics through network simulations based on observed social norms and e-cigarette use data. Simulations were initialized with baseline network data collected from 10 schools in a prospective cohort study of adolescent social networks and health behaviors in Southern California. Diffusion conditions varied by changes in social norms for intervention nodes (pro-e-cigarette, anti-e-cigarette, or neutral norms) and intervention strategy, where greater pro- and anti-tobacco norms were assigned to 15% of the network based on four intervention seeding conditions: opinion leadership, betweenness centrality, segmentation, and random selection. For each network, simulations were run using the netdiffuseR package in R and multivariate generalized linear models were estimated to examine changes in diffusion dynamics. Diffusion prevalence and rate were greater in denser networks and networks with more initial e-cigarette users. Anti-e-cigarette norms significantly decreased average prevalence across all intervention conditions. Strategically selecting high betweenness centrality nodes and opinion leader nodes significantly decreased the average prevalence of e-cigarette use. The results of this study show that achieving a change in norms for 15% of a network can substantially impact e-cigarette use prevalence. Furthermore, this study enhances our knowledge of how personal and network factors affect diffusion dynamics and demonstrates that targeting social norms through network-based interventions is one avenue for slowing the spread of harmful behaviors.'
keywords = ['published']

[najafzadehkhoeiMachineGeneralizeLearning2025a]
entrytype = 'online'
title = 'Generalized Machine Learning for Fast Calibration of Agent-Based Epidemic Models'
shorttitle = 'Generalized Machine Learning for Fast Calibration'
author = ['Najafzadehkhoei, Sima', 'Vega Yon, George Vega', 'Modenesi, Bernardo', 'Meyer, Derek S.']
date = '2025-09-06'
eprint = '2509.07013'
eprinttype = 'arXiv'
eprintclass = 'cs'
doi = '10.48550/arXiv.2509.07013'
url = 'http://arxiv.org/abs/2509.07013'
urldate = '2025-11-18'
pubstate = 'prepublished'
abstract = 'Agent-based models (ABMs) are widely used to study infectious disease dynamics, but their calibration is often computationally intensive, limiting their applicability in time-sensitive public health settings. We propose DeepIMC (Deep Inverse Mapping Calibration), a machine learning-based calibration framework that directly learns the inverse mapping from epidemic time series to epidemiological parameters. DeepIMC trains a bidirectional Long Short-Term Memory (BiLSTM) neural network on synthetic epidemic trajectories generated from agent-based models such as the Susceptible-Infected-Recovered (SIR) model, enabling rapid parameter estimation without repeated simulation at inference time. We evaluate DeepIMC through an extensive simulation study comprising 5,000 heterogeneous epidemic scenarios and benchmark its performance against Approximate Bayesian Computation (ABC) using likelihood-free Markov Chain Monte Carlo. The results show that DeepIMC substantially improves parameter recovery accuracy, produces sharp and well-calibrated predictive intervals, and reduces computational time by more than an order of magnitude relative to ABC. Although structural parameter identifiability constraints limit the precise recovery of all model parameters simultaneously, the calibrated models reliably reproduce epidemic trajectories and support accurate forward prediction with their estimated parameters. DeepIMC is implemented in the open-source R package epiworldRCalibrate, facilitating practical adoption for real-time epidemic modeling and policy analysis. Overall, our findings demonstrate that DeepIMC provides a scalable, operationally effective alternative to traditional simulation-based calibration methods for agent-based epidemic models.'
keywords = ['wip']

[mohammadiNovelApproachClassifying2025c]
entrytype = 'article'
title = 'A Novel Approach for Classifying Monoamine Neurotransmitters by Applying Machine Learning on UV Plasmonic-Engineered Auto Fluorescence Time Decay Series (AFTDS)'
author = ['Mohammadi, Mohammad', 'Najafzadehkhoei, Sima', 'Vega Yon, George G.', 'Wang, Yunshan']
date = '2025'
journaltitle = 'Nanoscale Advances'
shortjournal = 'Nanoscale Adv.'
volume = '7'
number = '24'
pages = '8013–8022'
issn = '2516-0230'
doi = '10.1039/D5NA00416K'
url = 'https://xlink.rsc.org/?DOI=D5NA00416K'
urldate = '2025-11-18'
langid = 'english'
abstract = 'This study introduces a hybrid approach integrating advanced plasmonic nanomaterials and machine learning (ML) for high-precision biomolecule detection. We leverage aluminum concave nanocubes (AlCNCs) as an innovative plasmonic substrate to enhance the native fluorescence of neurotransmitters, including dopamine (DA), norepinephrine (NE), and 3,4-dihydroxyphenylacetic acid (DOPAC). AlCNCs amplify weak fluorescence signals, enabling probe-free, label-free detection and differentiation of these molecules with great sensitivity and specificity. To further improve classification accuracy, we employ ML algorithms, with Long Short-Term Memory (LSTM) networks playing a central role in analyzing time-dependent fluorescence data. Comparative evaluations with k-nearest neighbors (KNN) and Random Forest (RF) demonstrate the superior performance of LSTM in distinguishing neurotransmitters. The results reveal that AlCNC substrates provide up to a 12-fold enhancement in fluorescence intensity for DA, 9-fold for NE, and 7-fold for DOPAC compared to silicon substrates. At the same time, ML algorithms achieve classification accuracy exceeding 89%. This interdisciplinary methodology bridges the gap between nanotechnology and ML, showcasing the synergistic potential of AlCNC-enhanced native fluorescence and ML in biosensing. The framework paves the way for probe-free, label-free biomolecule profiling, offering transformative implications for biomedical diagnostics and neuroscience research.'
keywords = ['published']

[milandoVisionEstimationInstantaneous2026]
entrytype = 'article'
title = 'A Vision for Estimation of the Instantaneous Reproductive Number'
author = ['Milando, Chad W.', 'Vega Yon, George G.', 'Johnson, Kaitlyn', 'Urbinati, Alessandra', 'St-Onge, Guillaume', 'Klein, Brennan', 'Cori, Anne', 'White, Laura F.']
year = '2026'
month = 'jan'
journal = 'Epidemics'
pages = '100885'
issn = '1755-4365'
doi = '10.1016/j.epidem.2026.100885'
url = 'https://www.sciencedirect.com/science/article/pii/S1755436526000010'
volume = '54'
abstract = 'The reproductive number, R t , is a popular metric used for monitoring infectious diseases. R t describes the expected number of infections that will be generated from a single infection at time t , which maps nicely to the likelihood that disease incidence will increase, decrease, or remain constant in the near future. Although this metric has existed for decades, it became more widely used during the COVID-19 pandemic and there was a subsequent proliferation of new estimation methods and software tools. This rapid development of methods and tools presents many opportunities and challenges for users, researchers, and decision makers. In recognition of this growth, we convened a three-day “collabathon” in September 2024 to bring together researchers and public health practitioners to identify challenges and areas for future development in R t estimation and to begin work in these areas. Here we provide a high-level summary of current methods and report on the findings from the collabathon, including a summary of current challenges and recommendations for future development, evaluation and interpretation of R t .'
keywords = ['published']

[vegayonPracticalGuidelinesReflections2026]
entrytype = 'misc'
title = 'Practical Guidelines and Reflections on Building Public Health Software: A Measles Case Study (Preprint)'
shorttitle = 'Practical Guidelines and Reflections on Building Public Health Software'
author = ['Vega Yon, George G.', 'Thornton, Delaney', 'Redd, Andrew', 'Pulsipher, Andrew', 'Toth, Damon', 'Dorsan, Egenia', 'Rennert, Lior', 'Johnson, Kaitlyn', 'White, Laura F', 'Gruninger, Randon', 'Nolen, Leisha D', 'Samore, Matthew H']
year = '2026'
month = 'feb'
publisher = 'JMIR Public Health and Surveillance'
doi = '10.2196/preprints.94240'
urldate = '2026-03-03'
archiveprefix = 'JMIR Public Health and Surveillance'
abstract = 'Academic–public health partnerships are essential for strengthening outbreak preparedness and response, yet translating modeling tools into routine public health practice remains challenging. Structural, technical, and workforce constraints often limit the capacity for modeling tools during emergencies. Here, we describe the development a software ecosystem designed to support real-time infectious disease response through sustained collaboration between an academic research team and public health agencies, with particular focus on the recent measles outbreak. The resulting software enabled real-time scenario modeling, visualization of transmission dynamics, and iterative updates as new data became available. Beyond immediate outbreak response, the initiative strengthened cross-sector collaboration, expanded modeling capacity, and highlighted ongoing gaps in technical infrastructure and workforce readiness at the state and local levels. This case study demonstrates how sustained academic–government partnerships combined with streamlined development practices can accelerate the translation of modeling tools into operational public health settings. Establishing and maintaining analytic infrastructure and agile processes between emergencies may be critical for ensuring timely, data-informed decision-making during future outbreaks.'
keywords = ['wip']

[duongIncorporatingSocialDeterminants2024]
entrytype = 'article'
title = 'Incorporating Social Determinants of Health into Transmission Modeling of COVID-19 Vaccine in the US: A Scoping Review'
shorttitle = 'Incorporating Social Determinants of Health into Transmission Modeling of COVID-19 Vaccine in the US'
author = ['Duong, Khanh N. C.', 'Nguyen, Danielle T.', 'Kategeaw, Warittakorn', 'Liang, Xi', 'Khaing, Win', 'Visnovsky, Lindsay D.', 'Veettil, Sajesh K.', 'McFarland, Mary M.', 'Nelson, Richard E.', 'Jones, Barbara E.', 'Pavia, Andrew T.', 'Coates, Emma', 'Khader, Karim', 'Love, Jay', 'Vega Yon, George G.', 'Zhang, Yue', 'Willson, Tina', 'Dorsan, Egenia', 'Toth, Damon J. A.', 'Jones, Makoto M.', 'Samore, Matthew H.', 'Chaiyakunapruk, Nathorn']
year = '2024'
month = 'jul'
journal = 'The Lancet Regional Health - Americas'
volume = '35'
pages = '100806'
issn = '2667-193X'
doi = '10.1016/j.lana.2024.100806'
url = 'https://doi.org/10.1016/j.lana.2024.100806'
abstract = "During COVID-19 in the US, social determinants of health (SDH) have driven health disparities. However, the use of SDH in COVID-19 vaccine modeling is unclear. This review aimed to summarize the current landscape of incorporating SDH into COVID-19 vaccine transmission modeling in the US. Medline and Embase were searched up to October 2022. We included studies that used transmission modeling to assess the effects of COVID-19 vaccine strategies in the US. Studies' characteristics, factors incorporated into models, and approaches to incorporate these factors were extracted. Ninety-two studies were included. Of these, 11 studies incorporated SDH factors (alone or combined with demographic factors). Various sets of SDH factors were integrated, with occupation being the most common (8 studies), followed by geographical location (5 studies). The results show that few studies incorporate SDHs into their models, highlighting the need for research on SDH impact and approaches to incorporating SDH into modeling. Funding: This research was funded by the Centers for Disease Control and Prevention (CDC)."
keywords = ['published']

[visnovskyMultidrugResistantOrganism2026]
entrytype = 'article'
title = 'P-1104. Multidrug-Resistant Organism (MDRO)-Contaminated Mobile Equipment Networks in Skilled Nursing Facilities'
author = ['Visnovsky, Lindsay D.', 'Leecaster, Molly', 'Vega Yon, George G.', 'Loc-Carrillo, Catherine M.', 'Dorsan, Egenia', 'Huber, Tavis', 'Jamu, Styn M.', 'Stratford, Kristina', 'Samore, Matthew H.', 'Drews, Frank A.']
year = '2026'
month = 'jan'
journal = 'Open Forum Infectious Diseases'
volume = '13'
doi = '10.1093/ofid/ofaf695.1299'
url = 'https://doi.org/10.1093/ofid/ofaf695.1299'
number = 'Supplement_1'
abstract = 'Background: Multidrug-resistant organisms (MDROs) are prevalent in skilled nursing facilities (SNFs). Mobile equipment has been linked to outbreaks but its role in MDRO endemicity is less understood. Methods: We conducted 2 waves of 4-day microbiological sampling 3 to 6 months apart in 3 ventilator-capable SNFs (1 academic affiliate, 2 community-based). We collected patient room composite samples at shift start; up to 8 types of shared equipment were sampled at start and end of sampling day and after observed use. Samples were enriched and plated on selective media (for methicillin-resistant Staphylococcus aureus, vancomycin-resistant Enterococcus, extended-spectrum β-lactamase producing Enterobacteriaceae, and multidrug-resistant Acinetobacter species). Presumptive MDRO positives were MALDI-confirmed. Wireless sensors in patient rooms and attached to shared equipment recorded equipment location and movement, allowing creation of bipartite networks (nodes: rooms and equipment). Two rooms were connected when the same equipment item visited both rooms. We used Exponential Family Random Graph Models to analyze network structure and test if: 1) a room was more likely to have an MDRO detected if connected by equipment to another room with the same MDRO and 2) MDRO detection frequency differed by facility. Results: 8 types of mobile equipment were studied but only glucometers were shared items at all facilities (Figure 1). Equipment degree (the number of different rooms an item visited during deployment) varied substantially (Figure 1). MDRO contamination depended on facility and equipment type (Figure 2). ESBLs and MRSA were the most common MDROs on room surfaces and mobile equipment. Contamination was low in facility A relative to other facilities (Table 1). Vital signs carts had a high median degree (12) but were rarely contaminated (6%, n=6). Shower beds also had high median degree (9) but were often contaminated (25%, n=13) in the two facilities that used them. Network analysis of facility B found that rooms connected by shared equipment were more likely to be contaminated by the same MDRO than unconnected rooms (p&lt; 0.05). Conclusion: Shared equipment in SNFs moves between patient rooms and is often MDRO-contaminated. Future work should study the role of shared equipment in MDRO transmission.'
keywords = ['published']

[maryeHiddenBurdenMeasles2026]
entrytype = 'misc'
title = 'Hidden Burden of a Measles Outbreak Revealed by Genomic and Transmission Models'
author = ['Marye, Abbey', 'Toth, Damon J. A.', 'Vega Yon, George G.', 'Wagoner, Jake', 'Lofgren, Eric T.', 'Samore, Matthew H.', 'Pavia, Andrew T.', 'Nolen, Leisha D.', 'Komatsu, Kenneth', 'Oakeson, Kelly', 'Keegan, Lindsay T.']
year = '2026'
month = 'jul'
publisher = 'medRxiv'
doi = '10.64898/2026.07.09.26357695'
url = 'https://doi.org/10.64898/2026.07.09.26357695'
pubstate = 'prepublished'
archiveprefix = 'medRxiv'
abstract = 'Declining childhood vaccination rates have fueled a resurgence of measles in the United States. Surveillance systems may not accurately measure the true extent of outbreaks. As of May 2026, the largest ongoing measles outbreak in the United States originated along the Utah-Arizona border in a community with high vaccine exemption rates and limited engagement with healthcare systems, leading to incomplete testing and reporting. To quantify the true outbreak size, we used two independent approaches with complementary data sources: a phylodynamic analysis and an agent-based model. Both methods found significant underreporting, estimating the true outbreak size to be 3.1- to 4.8-fold larger than reported, with confirmed cases representing only 20.96%-32.5% total infections. These findings suggest that substantial underreporting of measles occurs, especially in tight knit communities. The use of complementary analytical approaches to evaluate completeness of reporting can reveal the extent of measles transmission and aid control efforts.'
keywords = ['wip']

[johnsonBayesianGenerativeModeling2026]
entrytype = 'misc'
title = 'Bayesian Generative Modeling for Heterogeneous Wastewater Data Applied to COVID-19 Forecasting'
author = ['Johnson, Kaitlyn E.', 'Vega Yon, George G.', 'Brand, Samuel P. C.', 'Bernal Zelaya, Christian O.', 'Bayer, Damon', 'Volkov, Igor', 'Susswein, Zachary', 'Magee, Andrew', 'Gostic, Katelyn M.', 'English, Kayla M.', 'Ghinai, Isaac', 'Hamlet, Arran', 'Olesen, Scott W.', 'Pulliam, Juliet R. C.', 'Abbott, Sam', 'Morris, Dylan H.']
year = '2026'
month = 'feb'
publisher = 'medRxiv'
doi = '10.64898/2026.02.23.26346887'
url = 'https://doi.org/10.64898/2026.02.23.26346887'
pubstate = 'prepublished'
archiveprefix = 'medRxiv'
abstract = 'Infectious disease forecasts can inform public health decision-making. Wastewater monitoring is a relatively new epidemiological data source with multiple potential applications, including forecasting. Incorporating wastewater data into epidemiological forecasting models is challenging, and relatively few studies have assessed whether this improves forecast performance. We present and evaluate a semi-mechanistic wastewater-informed forecasting model. The model forecasts COVID-19 hospital admissions at the state and territorial levels in the United States, based on incident hospital admissions data and, optionally, SARS-CoV-2 wastewater concentration data from multiple wastewater sampling sites. From February through April 2024, we produced real-time wastewater-informed COVID-19 forecasts using development versions of the model and submitted them to the United States COVID-19 Forecast Hub (“the Hub”). We then published an open-source R package, wwinference , that implements the model with or without wastewater as an input. Using proper scoring rules and measures of model calibration, we assess both our real-time submissions to the Hub and retrospective hypothetical forecasts from wwinference made with and without wastewater data. While the models performed similarly with and without the wastewater signal included, there was substantial heterogeneity for individual locations and dates where wastewater data meaningfully improved or degraded the model’s forecast performance. Compared to other models submitted to the Hub during the period spanned by our submissions, the real-time wastewater-informed version of our model ranked fourth of 10 models, with the hospital admissions-only version of our model ranking second out of 10 models. Across the 2023-2024 winter epidemic wave, retrospective forecasts from wwinference would have performed similarly with and without the wastewater signal included: fifth and fourth out of 10 models, respectively. To better understand the drivers of differential forecast performance with and without wastewater, we performed an exploratory analysis investigating the relationship between characteristics of the input data and improved and reduced performance in our model. Based on that analysis, we identify and discuss key areas for further model development. To our knowledge, this is the first work that conducts an evaluation of real-time and retrospective infectious disease forecasts across the United States both with and without wastewater data and compared to other forecasting models.'
keywords = ['wip']

[lesslerWhyEpidemicRisk2026]
entrytype = 'misc'
title = 'Why Epidemic Risk at the 2026 World Cup May Not Be What You Think'
author = ['Lessler, Justin', 'Smith, Claire P.', 'Das, Praachi', 'Sykes, Abagael L.', 'Urbinati, Alessandra', 'Geith, Kelly', 'Powers, Kimberly A.', 'Davis, Jessica T.', 'Kern-Allely, Stephanie C.', 'Vega Yon, George G.', 'Lofgren, Eric T.', 'Pearson, Carl A. B.', 'Vespignani, Alessandro']
year = '2026'
month = 'may'
publisher = 'medRxiv'
doi = '10.64898/2026.05.28.26354384'
url = 'https://doi.org/10.64898/2026.05.28.26354384'
pubstate = 'prepublished'
archiveprefix = 'medRxiv'
abstract = 'Background: The 2026 FIFA World Cup may bring over one million visitors to North America from around the globe to participate in mass gathering events. The nature of the event and recent news have raised concerns for some that the tournament could lead to infectious disease outbreaks or fuel existing epidemics. Objective: To systematically assess the infectious disease threat posed to the United States by the tournament. Design: A multi-institutional team evaluated pathogen-specific risk across three dimensions: importation, outbreak potential, and impact to identify a priority pathogen list. A systematic screening protocol ensured common criteria and that pathogen information was collected when necessary to inform inclusion. Results: Increased risk from the World Cup is near zero for 63 of 77 evaluated pathogens. Pathogens were predominantly excluded as threats due to low excess importation risk and low outbreak potential if introduced. The remaining priority pathogens fall into five categories: (a) mosquito borne pathogens with the potential for sustained transmission in some host cities, (b) seasonal respiratory viruses, (c) chronic infections with high prevalence outside the United States, (d) pathogens present in the United States with likely increased transmission at World Cup activities, and (e) high-consequence infectious threats. Limitations: Data availability is variable across diseases. Impact calculations may not reflect actual costs to host cities. Disease incidence in World Cup travelers may differ from national incidence rates. Conclusion: While infectious disease outbreaks at the 2026 FIFA World Cup are possible, in an already highly connected world where large gatherings are frequent, the elevated risk from the tournament is not as extreme as it first may seem. Primary Funding Source: US Centers for Disease Control and Prevention'
keywords = ['wip']

