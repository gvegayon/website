author = "Najafzadehkhoei, Sima and \\textbf{Vega Yon}, \\textbf{George Vega} and Modenesi, Bernardo and Meyer, Derek S."
shorttitle = "Generalized {{Machine Learning}} for {{Fast Calibration}}"
title = "Generalized {{Machine Learning}} for {{Fast Calibration}} of {{Agent-Based Epidemic Models}}"
ENTRYTYPE = "online"
ID = "najafzadehkhoeiMachineGeneralizeLearning2025a"

[mohammadiNovelApproachClassifying2025c]
abstract = "This study introduces a hybrid approach integrating advanced plasmonic nanomaterials and machine learning (ML) for high-precision biomolecule detection. We leverage aluminum concave nanocubes (AlCNCs) as an innovative plasmonic substrate to enhance the native fluorescence of neurotransmitters, including dopamine (DA), norepinephrine (NE), and 3,4-dihydroxyphenylacetic acid (DOPAC). AlCNCs amplify weak fluorescence signals, enabling probe-free, label-free detection and differentiation of these molecules with great sensitivity and specificity. To further improve classification accuracy, we employ ML algorithms, with Long Short-Term Memory (LSTM) networks playing a central role in analyzing time-dependent fluorescence data. Comparative evaluations with k-nearest neighbors (KNN) and Random Forest (RF) demonstrate the superior performance of LSTM in distinguishing neurotransmitters. The results reveal that AlCNC substrates provide up to a 12-fold enhancement in fluorescence intensity for DA, 9-fold for NE, and 7-fold for DOPAC compared to silicon substrates. At the same time, ML algorithms achieve classification accuracy exceeding 89\\%. This interdisciplinary methodology bridges the gap between nanotechnology and ML, showcasing the synergistic potential of AlCNC-enhanced native fluorescence and ML in biosensing. The framework paves the way for probe-free, label-free biomolecule profiling, offering transformative implications for biomedical diagnostics and neuroscience research."
keywords = "published"
langid = "english"
