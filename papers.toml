[panahiVeteranPerspectivesEpilepsy2023]
url = "https://doi.org/10.1016/j.yebeh.2023.109218"
abstract = "Objective: Veterans are at elevated risk of epilepsy due to higher rates of traumatic brain injury (TBI). However, little work has examined the extent to which quality of care is associated with key outcomes for Veterans with epilepsy (VWE). This study aimed to examine the impact of quality of care on three outcomes: patients' knowledge of epilepsy self-care, proactive epilepsy self-management, and satisfaction with care. Method: We conducted a cross-sectional study of Post-9/11 Veterans with validated active epilepsy who received VA care (n = 441). Veterans were surveyed on care processes using American Academy of Neurology epilepsy quality measures, and a patient-generated measure related to the use of emergency care. Outcome measures included epilepsy self-care knowledge, proactive epilepsy self-management, and satisfaction with epilepsy care. Covariates included sociodemographic and health status variables and a measure of patient-provider communication. An ordinary least-squares (OLS) regression model was used to determine if the quality of care was associated with the outcomes adjusting for multiple comparisons. Results: Self-reported measures of quality of care were broadly associated with satisfaction with care and epilepsy knowledge. OLS modeling indicated that healthcare provider guidance on when to seek emergency care was significantly associated with higher Veteran satisfaction with care (p $<$ 0.01). Veterans who were asked about seizure frequency at every visit by their provider also reported higher satisfaction with care (p $<$ 0.01) and increased epilepsy knowledge (p $<$ 0.01). Veteran-provider communication was positively associated with epilepsy knowledge and proactive epilepsy self-management. Veterans with epilepsy with drug resistance epilepsy were significantly less satisfied with their care and reported lower proactivity compared to epilepsy controlled with medications. Further analysis indicated Black VWEs reported lower scores on epilepsy self-care knowledge compared to Whites (p $<$ 0.001). Conclusions: This study found that quality measures were associated with satisfaction and epilepsy knowledge but not associated with proactive self-management in multivariable models. The finding that better communication between providers and Veterans suggests that in addition to technical quality, interpersonal quality is important for patient outcomes. The secondary analysis identified racial disparities in epilepsy knowledge. This work offers opportunities to improve the quality of epilepsy care through the practice of patient-centered care models that reflect Veteran priorities and perceptions."
keywords = "published"
langid = "english"
doi = "10.1016/j.yebeh.2023.109218"
issn = "15255050"
pages = "109218"
volume = "144"
journal = "Epilepsy \\& Behavior"
month = "7"
year = "2023"
author = "Panahi, Samin and Kennedy, Eamonn and Roghani, Ali and \\textbf{Vega Yon}, \\textbf{George G.} and VanCott, Anne and Gugger, James J. and Raquel Lopez, Maria and Jo Pugh, Mary"
shorttitle = "Veteran Perspectives of Epilepsy Care"
title = "Veteran Perspectives of Epilepsy Care: {{Impact}} of {{Veteran}} Satisfaction, Knowledge, and Proactivity"
ENTRYTYPE = "article"
ID = "panahiVeteranPerspectivesEpilepsy2023"

[loveCharacterizingSpatiotemporalVariation2023]
abstract = "Understanding how transmission heterogeneity varies over the course of an enduring infectious disease outbreak improves understanding of observed disease dynamics and informs public health strategy. We quantified the spatiotemporal variation in transmission heterogeneity for the 2022 mpox outbreak in the US using the dispersion parameter of the offspring distribution, k . Our methods fit negative binomial distributions to transmission chain offspring distributions informed by a large mpox contact tracing dataset. We found that estimates of transmission heterogeneity varied across the outbreak, but overall estimated transmission heterogeneity was low. When testing our methods on simulated data, estimate accuracy depended on contact tracing data accuracy and completeness. Because the actual contact tracing data had high incompleteness, the values of k estimated from the empirical data may therefore be artificially high. Through simulation, we explore a method to correct estimated k for data incompleteness and, further, explore baseline expectations for temporal dynamics of k ."
keywords = "wip"
langid = "english"
