journal = "Open Forum Infectious Diseases"
month = "January"
year = "2026"
author = "Visnovsky, Lindsay D. and Leecaster, Molly and \\textbf{Vega Yon}, \\textbf{George G.} and {Loc-Carrillo}, Catherine M. and Dorsan, Egenia and Huber, Tavis and Jamu, Styn M. and Stratford, Kristina and Samore, Matthew H. and Drews, Frank A."
title = "P-1104. {{Multidrug-Resistant Organism}} ({{MDRO}})-{{Contaminated Mobile Equipment Networks}} in {{Skilled Nursing Facilities}}"
