[sargentAssessingDynamicsPrEP2024]
abstract = "This study examines the adoption of a new preventive treatment for HIV called preexposure prophylaxis (PrEP) in a nation-wide network of US physicians. We compare the structure of these networks across nine multi-state census regions, and assess geographic variations in network structure. Within these networks, we measured the adoption threshold associated with physician adoption of PrEP. The low threshold values that we observe are consistent with the hypothesis that slow PrEP adoption is the result of a lack of knowledge and exposure among physicians. Regression results demonstrate the mix of market, epidemiological, and socio/cultural factors that shape adoption thresholds."
