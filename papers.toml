journaltitle = "Nanoscale Advances"
date = "2025"
author = "Mohammadi, Mohammad and Najafzadehkhoei, Sima and \\textbf{Vega Yon}, \\textbf{George G.} and Wang, Yunshan"
title = "A Novel Approach for Classifying Monoamine Neurotransmitters by Applying Machine Learning on {{UV}} Plasmonic-Engineered Auto Fluorescence Time Decay Series ({{AFTDS}})"
