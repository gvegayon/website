[FabregaLacoa2013]
entrytype = 'article'
title = 'El impacto del rating televisivo sobre la actividad en Twitter: evidencia para Chile sobre la base del evento TELETÓN 2012'
author = ['Fábrega Lacoa, Jorge', 'Vega Yon, George G.']
year = '2013'
month = '12'
doi = '10.7764/cdi.33.533'
issn = '07193661'
journal = 'Cuadernos.info'
pages = '43–52'
url = 'http://cuadernos.info/index.php/CDI/article/view/533'
volume = '33'
abstract = '¿Tiene un impacto el rating televisivo sobre el volumen de actividad en Twitter? El surgimiento de medios sociales vía Internet está modificando las prácticas en la industria televisiva. En particular, los canales de televisión están integrando en sus programaciones de forma explícita la interacción con las audiencias vía medios sociales. Estos esfuerzos se están realizando motivados más por la intuición que por evidencia respecto a la eficacia de los mismos. Para contribuir a identificar el real impacto de los contenidos televisivos sobre la actividad en el medio social Twitter, este estudio propone el análisis estadístico de la relación entre rating televisivo y actividad en Twitter durante la transmisión de un mismo evento por todos los canales de televisión, la Teletón 2012. Los resultados sugieren la existencia de un impacto positivo y estadísticamente significativo que vincula el rating televisivo con la actividad en Twitter. Específicamente, durante el evento Teletón 2012, un aumento de un 1 punto del rating televisivo significó incrementos promedios de 1.5 tweets por minuto para el conjunto de la transmisión y de 6 tweets por minuto en horario prime.'
keywords = ['published']

