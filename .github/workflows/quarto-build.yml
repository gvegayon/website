name: Build and Deploy Quarto Website

on:
  schedule:
    # Sundays at 03:00 UTC, an hour after update-metrics. That job rebuilds on
    # its own when a number moves; this run is the safety net for talks.qmd,
    # whose content is fetched from the gvegayon/talks repo at render time and
    # so can change in a week with no metric change.
    - cron: '0 3 * * 0'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  # Called by update-metrics.yml once it has committed a new metrics.toml.
  workflow_call:
    inputs:
      ref:
        description: 'Branch or SHA to build. Defaults to the triggering ref.'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    container:
      image: rocker/tidyverse:4.5.1
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        # actions/checkout defaults to the SHA that triggered the run, which
        # predates the metrics commit when update-metrics.yml calls us.
        ref: ${{ inputs.ref }}

    - name: Get quarto 1.9.9
      run: |
        URL="https://github.com/quarto-dev/quarto-cli/releases/download/v1.9.9/quarto-1.9.9-linux-amd64.deb"
        wget "$URL" -O quarto.deb && dpkg -i quarto.deb
      shell: bash

    # cv/cv.qmd renders to PDF via Typst, which resolves fonts from the system.
    # Keep this in step with .devcontainer/Containerfile.
    - name: Install CV fonts
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          fonts-open-sans fonts-dejavu-core
        fc-cache -f
      shell: bash

    # Offline: metrics.toml is committed, so this needs no network for data.
    # Refreshing it is update-metrics.yml's job.
    - name: Render Quarto website
      run: |
        make

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git config --global --add safe.directory /__w/website/website

    - name: Commit rendered site
      if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')
      run: |
        # Check if there are any changes in public directory
        if [ -d "public" ]; then
          git add public/ metrics.toml
          if ! git diff --staged --quiet; then
            git commit -m "Update website - $(date)"
            git push
          else
            echo "No changes to commit"
          fi
        else
          echo "Public directory not found"
          exit 1
        fi

    - name: Upload site as artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: built-site
        path: public/
        retention-days: 7

  post-artifact:
    needs: build-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Post artifact comment on PR
      uses: CDCgov/cfa-actions/post-artifact@main
      with:
        artifact-name: built-site
        gh-token: ${{ secrets.GITHUB_TOKEN }}
