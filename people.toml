# Collaborator roster.
#
# One table per person, keyed by a short slug. Everything is optional except
# `name`. Entries here are matched against the `author` arrays in papers.toml
# and software.toml by surname + first initial, so a paper does not need to be
# edited for a collaborator to gain a link and an affiliation.
#
# When a name is spelled several ways across the sources, list the variants in
# `aka` and they will all resolve to this entry.
#
# This file is deliberately partial. Affiliations are only recorded here when
# they come from a source in this repo (people.qmd, cv/cv.qmd); the rest are
# filled in automatically from OpenAlex, which reports the institution on each
# authorship. Do not guess -- a wrong affiliation is worse than none.
#
# --- fields used for author-link resolution (papers.toml / software.toml) ---
#   name, url, orcid, affiliation, affiliation_short, aka, self, photo
#
# `photo` is a site-root-relative path, same convention as `hex`/`image` in
# the .toml files -- no leading slash (see asset_url() in R/html.R). It is the
# switch: an entry with no `photo` renders exactly as it did before this field
# existed. A photo may only be added via the review workflow in
# tools/people-photos/ (identity verification + George's sign-off before
# commit); provenance for every approved photo lives in img/people/MANIFEST.toml.
#
# `affiliation_short` is an optional compact label ("CFA, CDC") for an
# `affiliation` too long to sit under a name in the detail-page author list
# ("Center for Forecasting and Outbreak Analytics, CDC"). When set, it is the
# visible text and the full `affiliation` becomes a hover tooltip; when absent,
# the full `affiliation` shows as before. Only the detail-page author list uses
# it -- cards already keep the affiliation to a tooltip. See author_aff_html()
# in R/detail.R.
#
# --- fields used only by the generated People page (R/people_page.R) -------
#   group ("current" | "past"), start, end, bio, bio_es, bio_zh, display
#
# `group` is what puts someone on the People page at all -- an entry present
# only for author-link resolution (a frequent coauthor, a distant mentor
# covered by the page's own hand-written "My own mentors" section) should NOT
# have one. `start`/`end` are years; an omitted `end` renders as "<start>-
# present" (i18n'd). `bio_es`/`bio_zh` are optional per-language overrides of
# `bio`, falling back to the English `bio` when absent, same rule get_i18n()
# uses. `display` overrides the name shown on the People page (default:
# derived from `name`, "Last, First" -> "First Last").

