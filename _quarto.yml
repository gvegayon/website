project:
  type: website
  output-dir: public
  # Regenerates research/*.qmd and software/*.qmd before the render.
  # `make` runs this too; declared here so `quarto preview` also works.
  pre-render: R/build_pages.R
  render:
    # This glob recurses, so it also claims es/*.qmd, zh/*.qmd and cv/cv.qmd.
    #
    # Do NOT add "!es/" / "!zh/" here to stop that. Quarto then treats
    # public/es and public/zh as orphaned output and DELETES both directories
    # on the next root render (verified again 2026-08-14: a bare
    # `quarto render .` took public/es and public/zh from 6 pages to 0).
    # The Makefile compensates by ordering instead -- root, then es, then zh --
    # so a full `make` always ends with the correct translated navbars.
    - "*.qmd"
    - "research/*.qmd"
    - "software/*.qmd"
    - "!README.md"

  resources:
    - "img/"
    - "assets/"
    - "robots.txt"
    # public/_redirects was a second hand-maintained copy, free to drift from
    # this one. Listing it here makes the render the single source of truth.
    - "_redirects"

website:
  title: "George G. Vega Yon, Ph.D."
  image: img/logo.svg
  search: true
  # The apex is canonical -- www.ggvy.cl 301s here, so never use the www form.
  # site-url is what unlocks sitemap.xml, <link rel="canonical">, and the
  # og:/twitter: tags below; without it Quarto emits none of them.
  site-url: https://ggvy.cl
  # Quarto reads og-card.png off disk for og:image:width/height, so the
  # dimensions are never declared here -- any values given are overwritten.
  open-graph:
    image: /img/og-card.png
  twitter-card:
    card-style: summary_large_image
    image: /img/og-card.png
  description: |
    Personal website of Doctor George G. Vega Yon, an Associate Research Professor in the Division of Epidemiology at the University of Utah. Dr. Vega Yon works on Statistical Computing, Data Science, and Scientific Software Development.
  navbar:
    # Logo only. The name would otherwise appear twice on the
    # homepage: once here and once in the page's own <h1>.
    title: false
    logo: img/logo.svg
    logo-alt: "George G. Vega Yon, Ph.D."
    background: "#ff8000ff"
    foreground: white
    collapse-below: lg
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: software.qmd
        text: Software
      - href: talks.qmd
        text: Talks
      - href: teaching.qmd
        text: Teaching
      - href: people.qmd
        text: People
      - text: 'Resume/CV'
        menu:
          - text: Resume (brief)
            href: cv/resume.docx
          - text: CV (academic)
            href: cv/cv.pdf
    right:
      - href: es/index.html
        text: 🇨🇱
      - href: zh/index.html
        text: 🇨🇳
      - href: https://github.com/gvegayon
        icon: github
      - href: https://linkedin.com/in/georgevegayon
        icon: linkedin
      - href: https://scholar.google.com/citations?user=34E1yTAAAAAJ&hl=en
        icon: mortarboard-fill
      - href: https://bsky.app/profile/gvegayon.bsky.social
        icon: bluesky
      - href: https://orcid.org/0000-0002-3171-0844
        text: ORCID
  google-analytics: G-FH7BRCRDTQ

  page-footer:
    center: |
      © 2025 George G. Vega Yon. All rights reserved.

format:
  html:
    theme:
      - default
    css:
      - styles.css
      - assets/css/cards.css
    toc: false
    page-layout: article
    # Needs site-url; emits <link rel="canonical"> on every page.
    canonical-url: true
    include-in-header:
      - file: _includes/person-jsonld.html
    include-after-body:
      - file: _includes/after-body.html

execute:
  freeze: false