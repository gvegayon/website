project:
  type: website
  output-dir: ../public/es
  render: 
    - "*.qmd"

  resources:
    - "../img/"

# Sets <html lang="es">.
lang: es

website:
  title: "George G. Vega Yon, Ph.D."
  image: ../img/logo.svg
  search: true
  # Includes the /es segment: this project renders into ../public/es, so
  # without it every canonical and sitemap entry would claim the English URL.
  site-url: https://ggvy.cl/es
  # Absolute, not /img/og-card.png: Quarto resolves a root-relative image
  # against site-url, which here would yield the nonexistent
  # https://ggvy.cl/es/img/og-card.png. The card lives only at the apex.
  open-graph:
    image: https://ggvy.cl/img/og-card.png
  twitter-card:
    card-style: summary_large_image
    image: https://ggvy.cl/img/og-card.png
  description: |
    Sitio web personal del Doctor George G. Vega Yon, Profesor Asociado de Investigación en la División de Epidemiología de la Universidad de Utah. El Dr. Vega Yon trabaja en Computación Estadística, Ciencia de Datos y Desarrollo de Software Científico.
  navbar:
    # Logo only. The name would otherwise appear twice on the
    # homepage: once here and once in the page's own <h1>.
    title: false
    logo: ../img/logo.svg
    logo-alt: "George G. Vega Yon, Ph.D."
    background: "#ff8000ff"
    foreground: white
    collapse-below: lg
    left:
      - href: index.qmd
        text: Inicio
      - href: research.qmd
        text: Investigación
      - href: software.qmd
        text: Software
      - href: talks.qmd
        text: Charlas
      - href: teaching.qmd
        text: Enseñanza
      - href: people.qmd
        text: Personas
      - text: 'Currículum'
        menu:
          - text: Resume (breve)
            href: ../cv/resume.docx
          - text: CV (académico)
            href: ../cv/cv.pdf
    right:
      - href: ../index.html
        text: 🇺🇸
      - href: ../zh/index.html
        text: 🇨🇳
      - href: https://github.com/gvegayon
        icon: github
      - href: https://linkedin.com/in/georgevegayon
        icon: linkedin
      - href: https://scholar.google.com/citations?user=34E1yTAAAAAJ&hl=en
        icon: mortarboard-fill
      - href: https://bsky.app/profile/gvegayon.bsky.social
        icon: bluesky
      - href: https://orcid.org/0000-0002-3171-0844
        text: ORCID
  google-analytics: G-FH7BRCRDTQ

  page-footer:
    center: |
      © 2025 George G. Vega Yon. Todos los derechos reservados.

format:
  html:
    theme:
      - default
    css:
      - ../styles.css
      - ../assets/css/cards.css
    toc: false
    page-layout: article
    # Needs site-url; emits <link rel="canonical"> on every page.
    canonical-url: true
    include-in-header:
      - file: ../_includes/person-jsonld.html
    include-after-body:
      - file: ../_includes/after-body-sub.html

execute:
  freeze: false
