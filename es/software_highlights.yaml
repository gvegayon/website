epiworld:
  title: epiworld
  img: img/epiworld.webp
  alt: ""
  description: |
    Un framework avanzado de modelado basado en agentes escrito en C++, diseñado para la creación rápida de prototipos de modelos de simulación enfocados en modelado epidemiológico. La biblioteca está disponible en R, Python, así como en un paquete shiny. Su aplicación más notable es el modelado del sarampión durante los recientes brotes en EE. UU.
  links:
    - label: GitHub
      url: https://github.com/UofUEpiBio/epiworld
      icon: github
    - label: Simulador de sarampión
      url: https://ggvy.cl/shiny/measles
      icon: play-circle
rgexf:
  title: rgexf
  img: img/rgexf.webp
  alt: ""
  description: |
    Crea, lee y escribe archivos de grafos 'GEXF' (Graph Exchange 'XML' Format) (utilizados en 'Gephi' y otros). Usando el paquete 'XML', rgexf permite leer y escribir archivos GEXF, incluyendo atributos, atributos visuales 'GEXF' (como color, tamaño y posición), dinámica de redes (tanto para aristas como nodos) y pesos de aristas. Los usuarios pueden construir/manejar grafos elemento por elemento o masivamente a través de data frames, visualizar el grafo en un navegador web a través de 'gexf-js' (una biblioteca 'javascript'), e interactuar con el paquete 'igraph'.
  links:
    - label: GitHub
      url: https://github.com/gvegayon/rgexf
      icon: github
    - label: Demostración de gexf-js
      url: https://gvegayon.github.io/rgexf/lesmiserables/
      icon: diagram-3
ergmito:
  title: ergmito
  img: img/ergmito.webp
  alt: ""
  description: |
    Simulación y estimación de Modelos de Grafos Aleatorios Exponenciales (ERGMs) para redes pequeñas usando estadísticas exactas como se muestra en Vega Yon et al. (2020). A diferencia del paquete 'ergm', 'ergmito' evita usar el Estimador de Máxima Verosimilitud de Cadena de Markov (MC-MLE) y en su lugar usa el Estimador de Máxima Verosimilitud (MLE) para ajustar ERGMs para redes pequeñas. Como la enumeración exhaustiva es computacionalmente factible para redes pequeñas, este paquete de R aprovecha esto y proporciona herramientas para calcular funciones de verosimilitud y otras funciones relevantes directamente, lo que significa que en muchos casos tanto la estimación como la simulación de ERGMs para redes pequeñas pueden ser más rápidas y precisas que los algoritmos basados en simulación.
  links:
    - label: GitHub
      url: https://github.com/muriteams/ergmito
      icon: github
    - label: Artículo
      url: https://doi.org/10.1016/j.socnet.2020.07.005
      icon: file-earmark-text
