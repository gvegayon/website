epiworld:
  title: epiworld
  img: img/epiworld.webp
  alt: ""
  description: |
    一个用 C++ 编写的高级基于代理的建模框架，专为流行病学建模的快速原型设计而设计。该库可在 R、Python 以及 shiny 包中使用。其最值得注意的应用是对美国近期麻疹爆发的建模。
  links:
    - label: GitHub
      url: https://github.com/UofUEpiBio/epiworld
      icon: github
    - label: 麻疹模拟器
      url: https://ggvy.cl/shiny/measles
      icon: play-circle
rgexf:
  title: rgexf
  img: img/rgexf.webp
  alt: ""
  description: |
    创建、读取和写入 'GEXF'（图形交换 'XML' 格式）图形文件（用于 'Gephi' 等）。使用 'XML' 包，rgexf 允许读取和写入 GEXF 文件，包括属性、'GEXF' 可视化属性（如颜色、大小和位置）、网络动态（节点和边）以及边的权重。用户可以逐元素或通过数据框大量构建/处理图形，通过 'gexf-js'（一个 'javascript' 库）在网页浏览器上可视化图形，并与 'igraph' 包交互。
  links:
    - label: GitHub
      url: https://github.com/gvegayon/rgexf
      icon: github
    - label: gexf-js 线上展示
      url: https://gvegayon.github.io/rgexf/lesmiserables/
      icon: diagram-3
ergmito:
  title: ergmito
  img: img/ergmito.webp
  alt: ""
  description: |
    使用精确统计量对小型网络的指数随机图模型（ERGMs）进行模拟和估计，如 Vega Yon 等人（2020）所示。与 'ergm' 包不同，'ergmito' 避免使用马尔可夫链最大似然估计器（MC-MLE），而是使用最大似然估计器（MLE）来拟合小型网络的 ERGMs。由于对小型网络来说详尽枚举在计算上是可行的，因此这个 R 包利用了这一点，并提供了直接计算似然函数和其他相关函数的工具，这意味着在许多情况下，小型网络的 ERGMs 估计和模拟都可以比基于模拟的算法更快、更准确。
  links:
    - label: GitHub
      url: https://github.com/muriteams/ergmito
      icon: github
    - label: 论文
      url: https://doi.org/10.1016/j.socnet.2020.07.005
      icon: file-earmark-text
