project:
  type: website
  output-dir: ../public/zh
  render: 
    - "*.qmd"

  resources:
    - "../img/"

# Sets <html lang="zh-Hans"> -- this edition is Simplified Chinese, the
# more widely read script (converted from Traditional in 2026-10). Keep the
# script subtag: plain "zh" says nothing about which one the page uses.
lang: zh-Hans

website:
  title: "George G. Vega Yon, Ph.D."
  image: ../img/logo.svg
  search: true
  # Includes the /zh segment: this project renders into ../public/zh, so
  # without it every canonical and sitemap entry would claim the English URL.
  site-url: https://ggvy.cl/zh
  # Absolute, not /img/og-card.png: Quarto resolves a root-relative image
  # against site-url, which here would yield the nonexistent
  # https://ggvy.cl/zh/img/og-card.png. The card lives only at the apex.
  open-graph:
    image: https://ggvy.cl/img/og-card.png
  twitter-card:
    card-style: summary_large_image
    image: https://ggvy.cl/img/og-card.png
  description: |
    George G. Vega Yon 博士的个人网站，犹他大学流行病学系研究副教授。Vega Yon 博士从事统计计算、数据科学和科学软件开发工作。
  navbar:
    # Logo only. The name would otherwise appear twice on the
    # homepage: once here and once in the page's own <h1>.
    title: false
    logo: ../img/logo.svg
    logo-alt: "George G. Vega Yon, Ph.D."
    # Must match --main-color in ../styles.css -- that file is the source of
    # truth and overrides this with !important, but Quarto needs a literal
    # hex here too for its own navbar theming.
    background: "#A85200"
    foreground: white
    collapse-below: lg
    left:
      - href: index.qmd
        text: 主页
      - href: research.qmd
        text: 研究
      - href: software.qmd
        text: 软件
      - href: talks.qmd
        text: 演讲
      - href: teaching.qmd
        text: 教学
      - href: people.qmd
        text: 团队
      - text: '简历'
        menu:
          - text: Resume (简要)
            href: ../cv/resume.docx
          - text: CV (学术)
            href: ../cv/cv.pdf
      # 外部连结：咨询服务有自己的网站，不在本站。
      - href: https://vyanalytics.io/
        text: 咨询
    right:
      - href: ../index.html
        text: '<span class="flag flag--us" role="img" aria-label="English" title="English"></span>'
      - href: ../es/index.html
        text: '<span class="flag flag--cl" role="img" aria-label="Español" title="Español"></span>'
      - href: https://github.com/gvegayon
        icon: github
      - href: https://linkedin.com/in/georgevegayon
        icon: linkedin
      - href: https://scholar.google.com/citations?user=34E1yTAAAAAJ&hl=en
        icon: mortarboard-fill
      - href: https://bsky.app/profile/gvegayon.bsky.social
        icon: bluesky
      - href: https://orcid.org/0000-0002-3171-0844
        text: ORCID
  google-analytics: G-FH7BRCRDTQ

  page-footer:
    center: |
      © 2026 George G. Vega Yon. 版权所有。

format:
  html:
    theme:
      - default
    css:
      - ../styles.css
      - ../assets/css/cards.css
      - ../assets/css/talks.css
    toc: false
    page-layout: article
    # Needs site-url; emits <link rel="canonical"> on every page.
    canonical-url: true
    include-in-header:
      - file: ../_includes/person-jsonld.html
    include-after-body:
      - file: ../_includes/after-body-sub.html

execute:
  freeze: false
