abstract = "A flexible tool for simulation and statistical inference of epidemiological models, emphasizing hierarchical multi-signal renewal models. Built on top of the 'numpyro' Python library, 'PyRenew' provides core components for model building. A renewal model estimates new infections from recent past infections using a generation interval, from which it infers the time-varying reproduction number R(t). PyRenew's strength lies in multi-signal integration for pooling information across diverse observed data streams, such as hospital admissions, wastewater concentrations, and emergency department visits, each with distinct observation delays, noise characteristics, and spatial resolutions."
keywords = ['epidemiology', 'bayesian']

