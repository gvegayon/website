status = 'active'
languages = ['R', 'Stan']
abstract = "An implementation of a hierarchical semi-mechanistic renewal approach jointly calibrating to multiple wastewater concentration datasets from subsets of a specified population and epidemiological indicators, such as cases or hospital admissions, from the whole population. The framework extends the widely used semi-mechanistic renewal framework 'EpiNow2', using a Bayesian latent variable approach implemented in the probabilistic programming language 'Stan'. The package fits these two data sources and produces estimated and forecasted hospital admissions, estimated and forecasted wastewater concentrations, and global and local R(t) estimates for the subpopulations represented by each wastewater catchment area."
keywords = ['epidemiology', 'bayesian']

