abstract = "Provides the 'C++' header-only library 'barry' for use in R packages. 'barry' is a 'C++' template library for counting sufficient statistics on binary arrays and building discrete exponential-family models. It provides tools for sparse arrays, user-defined count statistics, support set constraints, power set generation, and includes modules for Discrete Exponential Family Models (DEFMs) and network statistics. By placing these headers in this package, it offers an efficient distribution system for CRAN, avoiding replication of this code across the sources of other packages. This package follows the same approach as the 'BH' package, which provides 'Boost' headers for R packages."
