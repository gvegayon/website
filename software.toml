kind = 'dashboard'
abstract = "An AI-powered dashboard exploring the InsightNet research community: academic profiles and publications for researchers affiliated with InsightNet's centers. A scheduled pipeline collects papers and preprints from ORCID, Europe PMC, PubMed, arXiv, medRxiv/bioRxiv, and Crossref, and daily activity from public web pages, RSS/Atom, Bluesky, and GitHub, normalizing it into a static snapshot. The standalone site includes an AI-assisted expert-finder that answers questions from the collected publications and profiles, citing the underlying record, a browser-side keyword search, and a browsable, filterable publication list, with no runtime server or frontend dependencies."
